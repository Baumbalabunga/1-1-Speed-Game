<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1×1 Speed Challenge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 20px;
        }

        h1 {
            font-size: 34px;
            margin: 10px 0;
        }

        .subtitle {
            font-size: 17px;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            color: #222;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-size: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            border: none;
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            background: #2575fc;
            color: white;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.96);
        }

        #game {
            display: none;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .stat {
            font-size: 18px;
        }

        .number {
            font-size: 48px;
            font-weight: bold;
            margin: 25px 0;
        }

        #answer {
            font-size: 30px;
        }

        #feedback {
            height: 30px;
            font-weight: bold;
            margin: 10px;
        }

        #result {
            display: none;
        }

        .score {
            font-size: 55px;
            font-weight: bold;
            color: #2575fc;
        }

        .leaderboard {
            margin-top: 25px;
            text-align: left;
        }

        .leaderboard h2 {
            text-align: center;
        }

        .player {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            margin: 6px 0;
            background: #f1f3f7;
            border-radius: 10px;
        }

        .small {
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧠 1×1 Speed Challenge</h1>

    <div class="subtitle">
        Wie viele Aufgaben schaffst du in 60 Sekunden?
    </div>

    <!-- START -->
    <div class="card" id="start">

        <h2>Bereit? 🚀</h2>

        <p>Gib deinen Namen ein:</p>

        <input
            id="name"
            type="text"
            placeholder="Dein Name"
            maxlength="15"
        >

        <button onclick="startGame()">
            START! 🔥
        </button>

    </div>


    <!-- SPIEL -->
    <div class="card" id="game">

        <div class="stats">

            <div class="stat">
                ⏱️ <span id="time">60</span>
            </div>

            <div class="stat">
                🏆 <span id="score">0</span>
            </div>

        </div>

        <div class="number" id="question">
            7 × 8
        </div>

        <input
            id="answer"
            type="number"
            inputmode="numeric"
            placeholder="?"
        >

        <button onclick="checkAnswer()">
            Antwort ✅
        </button>

        <div id="feedback"></div>

    </div>


    <!-- ERGEBNIS -->
    <div class="card" id="result">

        <h2>⏰ Zeit abgelaufen!</h2>

        <p>Du hast geschafft:</p>

        <div class="score" id="finalScore">
            0
        </div>

        <p>richtige Aufgaben! 🎉</p>

        <button onclick="playAgain()">
            Nochmal spielen 🔄
        </button>

        <div class="leaderboard">

            <h2>🏆 Rangliste</h2>

            <div id="leaderboardList"></div>

        </div>

    </div>

    <div class="small">
        1×1 Speed Challenge
    </div>

</div>


<script>

let score = 0;
let timeLeft = 60;
let timer;
let num1;
let num2;
let correctAnswer;
let playerName = "";


/* Neue Aufgabe */
function newQuestion() {

    num1 = Math.floor(Math.random() * 10) + 1;
    num2 = Math.floor(Math.random() * 10) + 1;

    correctAnswer = num1 * num2;

    document.getElementById("question").textContent =
        num1 + " × " + num2;

    document.getElementById("answer").value = "";

    document.getElementById("answer").focus();
}


/* Spiel starten */
function startGame() {

    playerName =
        document.getElementById("name").value.trim();

    if (playerName === "") {
        playerName = "Spieler";
    }

    score = 0;
    timeLeft = 60;

    document.getElementById("score").textContent = score;
    document.getElementById("time").textContent = timeLeft;

    document.getElementById("start").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("game").style.display = "block";

    newQuestion();

    timer = setInterval(function() {

        timeLeft--;

        document.getElementById("time").textContent =
            timeLeft;

        if (timeLeft <= 0) {
            endGame();
        }

    }, 1000);
}


/* Antwort überprüfen */
function checkAnswer() {

    let answer =
        Number(document.getElementById("answer").value);

    if (answer === correctAnswer) {

        score++;

        document.getElementById("score").textContent =
            score;

        document.getElementById("feedback").textContent =
            "✅ Richtig!";

        newQuestion();

    } else {

        document.getElementById("feedback").textContent =
            "❌ Falsch!";

        document.getElementById("answer").value = "";

        document.getElementById("answer").focus();
    }
}


/* Enter-Taste funktioniert */
document.getElementById("answer").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            checkAnswer();
        }

    }
);


/* Spiel beenden */
function endGame() {

    clearInterval(timer);

    document.getElementById("game").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        score;

    saveScore();

    showLeaderboard();
}


/* Highscore speichern */
function saveScore() {

    let scores =
        JSON.parse(localStorage.getItem("scores")) || [];

    scores.push({
        name: playerName,
        score: score
    });

    scores.sort(function(a, b) {
        return b.score - a.score;
    });

    scores = scores.slice(0, 10);

    localStorage.setItem(
        "scores",
        JSON.stringify(scores)
    );
}


/* Rangliste anzeigen */
function showLeaderboard() {

    let scores =
        JSON.parse(localStorage.getItem("scores")) || [];

    let list =
        document.getElementById("leaderboardList");

    list.innerHTML = "";

    if (scores.length === 0) {

        list.innerHTML =
            "<p>Noch keine Ergebnisse.</p>";

        return;
    }

    scores.forEach(function(player, index) {

        let row =
            document.createElement("div");

        row.className = "player";

        row.innerHTML =
            "<span>" +
            (index + 1) +
            ". " +
            player.name +
            "</span>" +
            "<strong>" +
            player.score +
            " Punkte</strong>";

        list.appendChild(row);

    });
}


/* Nochmal spielen */
function playAgain() {

    document.getElementById("result").style.display =
        "none";

    document.getElementById("start").style.display =
        "block";
}


/* Rangliste beim Laden vorbereiten */
showLeaderboard();

</script>

</body>
</html>
